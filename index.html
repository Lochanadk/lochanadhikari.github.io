<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lochan Adhikari</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Inter',sans-serif;
  background:#0a0f1c;
  color:#e5e7eb;
}

/* NAV */
header{
  display:flex;
  justify-content:space-between;
  padding:20px;
  border-bottom:1px solid #1f2937;
}

nav a{
  margin-left:15px;
  text-decoration:none;
  color:#9ca3af;
  font-size:14px;
}

/* HERO */
.hero{
  text-align:center;
  padding:80px 20px 40px;
}

.profile{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  margin-bottom:15px;
}

.hero h1{font-size:24px;}
.hero p{font-size:14px;color:#9ca3af;}

/* SOCIAL */
.social{margin-top:15px;}
.social a{margin:0 8px;color:#9ca3af;font-size:18px;}

/* SECTION */
section{
  max-width:900px;
  margin:auto;
  padding:40px 20px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.card{
  background:#020617;
  border-radius:10px;
  overflow:hidden;
}

.card img, .card video{width:100%;}

/* FOOTER */
footer{
  text-align:center;
  padding:20px;
  color:#6b7280;
  font-size:12px;
  border-top:1px solid #1f2937;
}

@media(max-width:600px){
  .grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<header>
  <h2>Lochan Adhikari</h2>
  <nav>
    <a href="#photos">Photos</a>
    <a href="#reels">Reels</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<div class="hero">
  <img src="images/profile.jpg" class="profile">
  <h1>Lochan Adhikari</h1>
  <p>Content Creator • Reels • Travel</p>

  <div class="social">
    <a href="https://www.facebook.com/share/1DZRXhxvLU/"><i class="fab fa-facebook"></i></a>
    <a href="https://www.instagram.com/lochan_adhikari1"><i class="fab fa-instagram"></i></a>
    <a href="https://www.tiktok.com/@lochan069"><i class="fab fa-tiktok"></i></a>
    <a href="https://wa.me/9779803278899"><i class="fab fa-whatsapp"></i></a>
  </div>
</div>

<section id="photos">
  <h2>Photos</h2>
  <div class="grid">
    <div class="card"><img src="images/photo1.jpg"></div>
    <div class="card"><img src="images/photo2.jpg"></div>
  </div>
</section>

<section id="reels">
  <h2>Reels</h2>
  <div class="grid">
    <div class="card"><video src="videos/reel1.mp4" controls></video></div>
    <div class="card"><video src="videos/reel2.mp4" controls></video></div>
  </div>
</section>

<section id="contact">
  <h2>Contact</h2>
  <p>Email: info.tribikram@gmail.com</p>
  <p>Location: Nepal & South Africa</p>
  <p>WhatsApp: +9779803278899 / +243828085706</p>
</section>

<footer>
  © 2026 Lochan Adhikari
</footer>

</body>
</html>
