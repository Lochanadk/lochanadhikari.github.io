<head>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#000;color:#fff}

/* LOADER */
#loader{
position:fixed;
width:100%;
height:100vh;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
font-size:22px;
}

/* HERO */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}
.hero img{
width:130px;
height:130px;
border-radius:50%;
border:3px solid #fff;
}
.hero h2{margin-top:12px;font-size:28px}
.hero p{color:#aaa}

/* SOCIAL */
.socials{
margin-top:15px;
}
.socials a{
margin:0 10px;
font-size:22px;
color:#fff;
}

/* REELS */
.reels{
height:100vh;
overflow-y:scroll;
scroll-snap-type:y mandatory;
}
.reel{
height:100vh;
scroll-snap-align:start;
position:relative;
}
.reel video{
width:100%;
height:100%;
object-fit:cover;
}

/* OVERLAY */
.overlay{
position:absolute;
bottom:80px;
left:15px;
}
.overlay h3{font-size:18px}

/* ACTIONS */
.actions{
position:absolute;
right:15px;
bottom:100px;
display:flex;
flex-direction:column;
gap:18px;
}
.actions i{
font-size:22px;
}

/* SECTION */
.section{
padding:40px 15px;
}
.title{
font-size:20px;
margin-bottom:15px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}
.grid img{
width:100%;
border-radius:10px;
}

/* CARD */
.card{
background:#111;
padding:15px;
border-radius:12px;
text-align:center;
}

/* BUTTON */
.button{
display:inline-block;
margin-top:10px;
padding:10px 20px;
background:#60bb46;
border-radius:20px;
color:#fff;
text-decoration:none;
}

/* CONTACT GRID */
.contact{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

/* BOTTOM NAV */
.bottom-nav{
position:fixed;
bottom:0;
width:100%;
background:#111;
display:flex;
justify-content:space-around;
padding:12px 0;
}
.bottom-nav a{
color:#fff;
font-size:20px;
}

/* FOOTER */
footer{
text-align:center;
padding:15px;
background:#000;
font-size:14px;
}
</style>
</head>
