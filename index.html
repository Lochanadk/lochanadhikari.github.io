<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lochan Adhikari</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
background:linear-gradient(180deg,#ffe066,#fff6cc);
color:#111;
}

/* HEADER */
header{
position:fixed;
top:0;
width:100%;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,0.6);
backdrop-filter:blur(12px);
border-bottom:1px solid #eee;
z-index:1000;
}

header h1{font-size:18px;font-weight:700;}

/* HERO */
.hero{
padding-top:100px;
text-align:center;
padding-bottom:40px;
}

.hero img{
width:130px;height:130px;border-radius:50%;
border:4px solid white;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.hero h2{margin-top:15px;font-size:26px;font-weight:700;}
.hero p{margin-top:5px;color:#555;font-size:14px;}

.socials{margin-top:15px;}
.socials a{
margin:0 10px;
font-size:20px;
color:#111;
transition:0.3s;
}
.socials a:hover{color:#000;}

/* SECTION */
.section{
padding:40px 20px;
max-width:1000px;
margin:auto;
}

.title{
font-size:20px;
font-weight:700;
margin-bottom:15px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.grid img,.grid video{
width:100%;
border-radius:14px;
}

/* CARD */
.card{
background:white;
padding:18px;
border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

/* CONTACT */
.contact{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

/* BUTTON */
.button{
display:inline-block;
margin-top:10px;
padding:10px 20px;
border-radius:25px;
background:#60bb46;
color:white;
text-decoration:none;
font-weight:600;
}

/* NAVBAR */
.bottom-nav{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
box-shadow:0 -5px 20px rgba(0,0,0,0.08);
}

.bottom-nav a{
display:flex;
flex-direction:column;
align-items:center;
text-decoration:none;
color:#444;
font-size:11px;
transition:0.3s;
}

.bottom-nav i{
font-size:18px;
margin-bottom:3px;
}

.bottom-nav a:hover{
color:#000;
transform:translateY(-2px);
}

/* FOOTER */
footer{
text-align:center;
padding:20px;
font-size:13px;
margin-bottom:60px;
}
</style>
</head>

<body>

<header>
<h1>Lochan</h1>
</header>

<!-- HERO -->
<section class="hero">
<img src="images/profile.jpg">
<h2>Lochan Adhikari</h2>

<div class="socials">

<a href="#"><i class="fab fa-instagram"></i></a>
<a href="#"><i class="fab fa-tiktok"></i></a>
<a href="#"><i class="fab fa-whatsapp"></i></a>
</div>
</section>

<!-- REELS -->
<section class="section" id="reels">
<div class="title">Reels</div>
<div class="grid">
<video controls src="videos/reel1.mp4"></video>
<video controls src="videos/reel2.mp4"></video>
<video controls src="videos/reel3.mp4"></video>
<video controls src="videos/reel4.mp4"></video>
</div>
</section>

<!-- PHOTOS -->
<section class="section">
<div class="title">Photos</div>
<div class="grid">
<img src="images/photo1.jpg">
<img src="images/photo2.jpg">
<img src="images/photo3.jpg">
<img src="images/photo4.jpg">
</div>
</section>

<!-- MEMES -->
<section class="section">
<div class="title">Memes</div>
<div class="grid">
<img src="images/meme1.jpg">
<img src="images/meme2.jpg">
</div>
</section>

<!-- DONATE -->
<section class="section" id="donate">
<div class="title">Support Me</div>
<div class="card">
<p><i class="fa-solid fa-wallet"></i> eSewa: <b>+9779803278899</b></p>

<img src="images/esewa-qr.jpg" style="width:140px;margin-top:10px;border-radius:10px">

</section>

<!-- CONTACT -->
<section class="section" id="contact">
<div class="title">Contact</div>
<div class="contact">
<div class="card"><i class="fa-solid fa-envelope"></i><br>Email<br><b>info.tribikram@gmail.com</b></div>

<div class="card"><i class="fa-solid fa-location-dot"></i><br>Location<br><b>Nepal</b></div>
<div class="card"><i class="fa-solid fa-briefcase"></i><br>Status<br><b>Available</b></div>
</div>
</section>

<!-- NAV -->
<div class="bottom-nav">

<a href="#">
<i class="fa-solid fa-house"></i>
<span>Home</span>
</a>

<a href="#reels">
<i class="fa-solid fa-clapperboard"></i>
<span>Reels</span>
</a>

<a href="#donate">
<i class="fa-solid fa-wallet"></i>
<span>Donate</span>
</a>

<a href="#contact">
<i class="fa-solid fa-phone"></i>
<span>Contact</span>
</a>

</div>

<footer>© 2026 Lochan Adhikari</footer>

</body>
</html>
