<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lochan Adhikari</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
background:#fdf6d8;
color:#222;
line-height:1.6;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

header{
position:sticky;
top:0;
background:#fff9e6;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #eee;
z-index:1000;
}

header h1{
font-size:22px;
font-weight:600;
}

.lang-btn{
padding:6px 14px;
border-radius:20px;
border:none;
background:#222;
color:#fff;
cursor:pointer;
font-size:12px;
}

.hero{
text-align:center;
padding:60px 20px 40px;
}

.hero img{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
border:3px solid #fff;
box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

.hero h2{
margin-top:15px;
font-size:26px;
font-weight:600;
}

.hero p{
color:#666;
font-size:14px;
margin-top:5px;
}

.section{
margin-top:40px;
}

.section h3{
font-size:20px;
margin-bottom:15px;
font-weight:600;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;
}

.grid img,.grid video{
width:100%;
border-radius:12px;
}

.card{
background:#fff;
padding:18px;
border-radius:12px;
border:1px solid #eee;
}

.caption{
text-align:center;
font-size:13px;
margin-top:6px;
color:#555;
}

.contact-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;
}

.contact-card{
background:#fff;
padding:15px;
border-radius:12px;
border:1px solid #eee;
text-align:center;
font-size:14px;
}

.button{
display:inline-block;
margin-top:10px;
padding:10px 18px;
background:#60bb46;
color:#fff;
border-radius:20px;
text-decoration:none;
font-size:14px;
}

footer{
text-align:center;
margin-top:40px;
padding:20px;
font-size:13px;
color:#777;
}
</style></head><body><header>
<h1>Lochan</h1>
<button class="lang-btn" onclick="toggleLang()">EN / NE</button>
</header><div class="container"><section class="hero">
<img src="images/profile.jpg">
<h2 id="name">Lochan Adhikari</h2>
<p id="bio">Content Creator • Reels • Memes • Travel</p>
</section><section class="section">
<h3 id="reels">Reels</h3>
<div class="grid">
<video controls src="videos/reel1.mp4"></video>
<video controls src="videos/reel2.mp4"></video>
<video controls src="videos/reel3.mp4"></video>
<video controls src="videos/reel4.mp4"></video>
</div>
</section><section class="section">
<h3 id="photos">Photos</h3>
<div class="grid">
<div><img src="images/lochan-photo1.jpg"><p class="caption">Moment</p></div>
<div><img src="images/lochan-photo2.jpg"><p class="caption">Nature</p></div>
<div><img src="images/lochan-photo3.jpg"><p class="caption">Life</p></div>
<div><img src="images/lochan-photo4.jpg"><p class="caption">Travel</p></div>
<div><img src="images/lochan-photo5.jpg"><p class="caption">Memories</p></div>
</div>
</section><section class="section">
<h3 id="donate">Support Me</h3>
<div class="card">
<p><i class="fa-solid fa-wallet"></i> eSewa: <b>+9779803278899</b></p>
<a href="https://esewa.com.np" class="button">Donate</a>
</div>
</section><section class="section">
<h3 id="contact">Contact</h3>
<div class="contact-grid">
<div class="contact-card"><i class="fa-solid fa-envelope"></i><br>Email<br><b>info.tribikram@gmail.com</b></div>
<div class="contact-card"><i class="fa-solid fa-phone"></i><br>Phone<br><b>+9779803278899</b></div>
<div class="contact-card"><i class="fa-solid fa-location-dot"></i><br>Location<br><b>Nepal</b></div>
</div>
</section><footer>© 2026 Lochan Adhikari</footer></div><script>
let isEnglish=true;
function toggleLang(){
isEnglish=!isEnglish;
if(!isEnglish){
document.getElementById("bio").innerText="कन्टेन्ट क्रिएटर • रिल्स • मीम • यात्रा";
}else{
document.getElementById("bio").innerText="Content Creator • Reels • Memes • Travel";
}
}
</script></body>
</html>
