<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: Arial;
      background:#0f172a;
      color:white;
    }

    header {
      display:flex;
      justify-content:space-between;
      padding:15px;
      background:#020617;
    }

    nav a {
      color:#cbd5f5;
      margin-left:10px;
      text-decoration:none;
    }

    section {
      padding:40px 20px;
      text-align:center;
    }

    .grid {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:10px;
      margin-top:20px;
    }

    .card {
      background:#1e293b;
      padding:10px;
      border-radius:10px;
    }

    button {
      margin-top:10px;
      padding:10px;
      border:none;
      background:#38bdf8;
      border-radius:5px;
    }
  </style>
</head>

<body>

<header>
  <h2>Lochan Adhikari</h2>
  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>
</header>

<section>
  <h1>Hi, I'm Lochan 👋</h1>
  <p>Content Creator | Memes | Reels | Travel</p>
</section>

<section>
  <h2>Photos</h2>
  <div class="grid">
    <div class="card">Photo</div>
    <div class="card">Photo</div>
  </div>
</section>

<section>
  <h2>Memes</h2>
  <div class="grid">
    <div class="card">Meme</div>
    <div class="card">Meme</div>
  </div>
</section>

<section>

</html>
