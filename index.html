<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lochan Adhikari | Creator</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}

body{
  font-family:'Poppins',sans-serif;
  color:white;
  background:linear-gradient(-45deg,#020617,#0f172a,#1e293b,#020617);
  background-size:400% 400%;
  animation:bg 10s infinite linear;
}

/* BACKGROUND ANIMATION */
@keyframes bg{
  0%{background-position:0%}
  100%{background-position:100%}
}

/* NAV */
header{
  display:flex;
  justify-content:space-between;
  padding:15px 20px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
  position:sticky;
  top:0;
}

nav a{
  color:#cbd5f5;
  margin-left:10px;
  text-decoration:none;
  transition:0.3s;
}

nav a:hover{color:#38bdf8;}

/* HERO */
#home{
  text-align:center;
  padding:100px 20px;
}

.profile{
  width:120px;
  height:120px;
  border-radius:50%;
  border:3px solid #38bdf8;
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}

#typing{
  font-size:28px;
  margin-top:10px;
}

/* SOCIAL */
.social a{
  margin:10px;
  font-size:22px;
  color:white;
  transition:0.3s;
}

.social a:hover{
  color:#38bdf8;
  transform:scale(1.2);
}

/* SECTION */
section{
  padding:60px 20px;
  text-align:center;
  opacity:0;
  transform:translateY(40px);
  transition:1s;
}

section.show{
  opacity:1;
  transform:translateY(0);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:15px;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.05);
  border-radius:10px;
  overflow:hidden;
  backdrop-filter:blur(10px);
  transition:0.3s;
}

.card:hover{
  transform:scale(1.05);
}

.card img, video{
  width:100%;
}

/* WHATSAPP */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  padding:15px;
  border-radius:50%;
  color:white;
  text-decoration:none;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.1);}
  100%{transform:scale(1);}
}

/* FOOTER */
footer{
  padding:20px;
  background:#020617;
  text-align:center;
  color:#94a3b8;
}

</style>
</head>

<body>

<header>
  <h2>Lochan Adhikari</h2>
  <nav>
    <a href="#home">Home</a>
    <a href="#gallery">Photos</a>
    <a href="#reels">Reels</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<!-- HERO -->
<section id="home" class="show">
  <img src="images/profile.jpg" class="profile">

  <h1 id="typing"></h1>
  <p>Content Creator • Memes • Reels • Travel</p>

  <div class="social">
    <a href="https://www.facebook.com/share/1DZRXhxvLU/" target="_blank"><i class="fab fa-facebook"></i></a>
    <a href="https://www.instagram.com/lochan_adhikari1?igsh=MW4zajNhbzE3MWZiOQ==" target="_blank"><i class="fab fa-instagram"></i></a>
    <a href="https://www.tiktok.com/@lochan069?_r=1&_t=ZS-94s1KaQo2fE" target="_blank"><i class="fab fa-tiktok"></i></a>
    <a href="https://wa.me/9779803278899" target="_blank"><i class="fab fa-whatsapp"></i></a>
  </div>
</section>

<!-- GALLERY -->
<section id="gallery">
  <h2>Photos</h2>
  <div class="grid">
    <div class="card"><img src="images/photo1.jpg"></div>
    <div class="card"><img src="images/photo2.jpg"></div>
  </div>
</section>

<!-- REELS -->
<section id="reels">
  <h2>Reels</h2>
  <div class="grid">
    <div class="card"><video src="videos/reel1.mp4" controls></video></div>
    <div class="card"><video src="videos/reel2.mp4" controls></video></div>
  </div>
</section>

<!-- CONTACT -->
<section id="contact">
  <h2>Contact</h2>
  <p><a href="mailto:info.tribikram@gmail.com" style="color:#38bdf8;">info.tribikram@gmail.com</a></p>
  <p>📍 Nepal & South Africa</p>
  <p>📱 +9779803278899 / +243828085706</p>
</section>

<a href="https://wa.me/9779803278899" class="whatsapp">💬</a>

<footer>
  © 2026 Lochan Adhikari. All rights reserved.
</footer>

<script>

/* TYPING EFFECT */
const text="Hi, I'm Lochan 👋";
let i=0;

function typing(){
  if(i<text.length){
    document.getElementById("typing").innerHTML+=text.charAt(i);
    i++;
    setTimeout(typing,80);
  }
}
typing();

/* SCROLL ANIMATION */
const sections=document.querySelectorAll("section");

window.addEventListener("scroll",()=>{
  sections.forEach(sec=>{
    const top=sec.getBoundingClientRect().top;
    if(top<window.innerHeight-100){
      sec.classList.add("show");
    }
  });
});

</script>

</body>
</html>
